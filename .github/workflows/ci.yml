name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node-version }} — syntax and package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.19", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run build
      - run: npm pack --dry-run
